name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 准备测试路径（项目外）
        run: |
          {
            echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers"
            echo "TEST_ROOT=$RUNNER_TEMP/wp05-task-app-test-4311"
            echo "TEST_DATA_DIR=$RUNNER_TEMP/wp05-task-app-test-4311/data"
            echo "TEST_ARTIFACT_DIR=$RUNNER_TEMP/wp05-task-app-test-4311/artifacts"
            echo "PORT=4310"
            echo "TEST_PORT=4311"
          } >> "$GITHUB_ENV"
      - name: 安装依赖
        run: npm ci
      - name: 安装 Chromium
        run: npx playwright@1.49.1 install chromium
      - name: 构建
        run: npm run build
      - name: 测试
        run: npm test
